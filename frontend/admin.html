<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenzy Admin</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#242424;background:#f5f3ef}*{box-sizing:border-box}body{margin:0}.top{background:#171717;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;letter-spacing:3px}.wrap{max-width:1200px;margin:32px auto;padding:0 20px}.panel{background:white;border:1px solid #e7e2da;border-radius:14px;padding:24px;margin-bottom:22px}.hidden{display:none!important}h1,h2{font-family:Georgia,serif;font-weight:500}label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;font:inherit;background:white}textarea{min-height:130px}button,.btn{border:0;background:#171717;color:white;padding:12px 17px;border-radius:6px;cursor:pointer;font-weight:600;margin:8px 6px 0 0}.btn-light{background:#eee;color:#222}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button.active{background:#b78b4b}.item{padding:14px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:14px;align-items:center}.muted{color:#777;font-size:13px}.status{font-size:11px;letter-spacing:1px;background:#f1eee8;padding:5px 8px;border-radius:20px}.msg{margin:12px 0;color:#9b6027;white-space:pre-wrap}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}@media(max-width:800px){.grid2,.row{grid-template-columns:1fr}.item{display:block}}
</style></head><body><header class="top"><div class="brand">ZENZY COLLECTION <small> / ADMIN</small></div><button id="logout" class="hidden">LOG OUT</button></header><main class="wrap"><section id="login" class="panel" style="max-width:430px;margin:70px auto"><h1>Welcome back.</h1><p class="muted">Sign in to manage stories, images and customer bookings.</p><form id="loginForm"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button type="submit">SIGN IN</button></form><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><h1>Store management</h1><p class="muted">Manage editorial content and customer requests from one place.</p><div class="tabs"><button class="active" data-tab="articles">BLOG ARTICLES</button><button data-tab="bookings">CUSTOMER BOOKINGS</button><button data-tab="subscribers">NEWSLETTER</button></div></div>
<div id="articlesTab" class="grid2"><section class="panel"><h2 id="editorTitle">Create a story</h2><form id="articleForm"><input type="hidden" name="id"><label>Article title</label><input name="title" required maxlength="180" placeholder="e.g. How to build a timeless wardrobe"><div class="row"><div><label>Category</label>
<select name="category" required>
  <option value="Men's Fashion">Men's Fashion</option>
  <option value="Women's Fashion">Women's Fashion</option>
  <option value="Fashion Trends">Fashion Trends</option>
  <option value="Streetwear">Streetwear</option>
  <option value="Style Guides">Style Guides</option>
  <option value="Shopping Guides">Shopping Guides</option>
  <option value="Fabric & Clothing Care">Fabric & Clothing Care</option>
  <option value="Festive & Occasion Wear">Festive & Occasion Wear</option>
  <option value="Fashion Inspiration">Fashion Inspiration</option>
  <option value="Lifestyle">Lifestyle</option>
</select>
</div><div><label>Author</label><input name="author" value="Zenzy Editorial"></div></div><label>Short excerpt</label><textarea name="excerpt" style="min-height:70px" maxlength="500"></textarea><label>Article content</label><div class="tabs" style="margin:8px 0"><button type="button" class="btn-light" data-format="bold">B</button><button type="button" class="btn-light" data-format="italic"><i>I</i></button><button type="button" class="btn-light" data-format="h2">HEADING</button><button type="button" class="btn-light" data-format="h3">SUBHEADING</button><button type="button" class="btn-light" data-format="insertUnorderedList">• LIST</button><button type="button" class="btn-light" data-format="blockquote">QUOTE</button></div><div id="articleContent" contenteditable="true" style="min-height:260px;border:1px solid #ddd;border-radius:7px;padding:14px;line-height:1.7;outline:none" data-placeholder="Write your fashion story here..."></div><label>Cover image</label><input type="file" id="coverFile" accept="image/jpeg,image/png,image/webp"><input name="coverImage" placeholder="Image URL (or upload above)"><input name="coverImageAlt" placeholder="Image alt text"><div class="row"><div><label>SEO title (max 70)</label><input name="seoTitle" maxlength="70"></div><div><label>Focus keyword</label><input name="focusKeyword" maxlength="100"></div></div><label>Meta description (max 180)</label><textarea name="metaDescription" style="min-height:70px" maxlength="180"></textarea><label>Tags (comma separated)</label><input name="tags" placeholder="fashion, styling, wardrobe"><label><input type="checkbox" name="featured" style="width:auto"> Feature this article</label><label>Status</label><select name="status"><option value="draft">Save as draft</option><option value="published">Publish now</option></select><button type="submit">SAVE ARTICLE</button><button type="button" class="btn-light" id="resetArticle">CLEAR FORM</button><div id="articleMsg" class="msg"></div></form></section><section class="panel"><h2>Articles</h2><div class="row"><select id="articleFilter"><option value="">All articles</option><option value="draft">Drafts</option><option value="published">Published</option></select><button id="refreshArticles">REFRESH</button></div><div id="articleList" class="muted">Loading...</div></section></div>
<div id="subscribersTab" class="panel hidden"><h2>Newsletter subscribers</h2><p class="muted" id="subCount">Loading...</p><div class="row"><input id="subSearch" placeholder="Search email..."><button id="exportSubs">DOWNLOAD CSV</button></div><div id="subList">Loading...</div></div>
<div id="bookingsTab" class="panel hidden"><h2>Customer bookings</h2><div class="row"><select id="bookingFilter"><option value="">All requests</option><option>NEW</option><option>CONTACTED</option><option>CONFIRMED</option><option>COMPLETED</option><option>CANCELLED</option></select><button id="refreshBookings">REFRESH BOOKINGS</button></div><div id="bookingList">Loading...</div></div></section></main>
<script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('zenzy-admin-token')||'';const auth=()=>({'Authorization':'Bearer '+token});const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showDashboard(){ $('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');loadArticles();loadBookings(); }
$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)});const d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;localStorage.setItem('zenzy-admin-token',token);showDashboard()}catch(x){$('#loginMsg').textContent=x.message}};
$('#logout').onclick=()=>{localStorage.removeItem('zenzy-admin-token');token='';location.reload()};
document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{const box=$('#articleContent');box.focus();const cmd=b.dataset.format;if(cmd==='h2'||cmd==='h3')document.execCommand('formatBlock',false,cmd);else if(cmd==='blockquote')document.execCommand('formatBlock',false,'blockquote');else document.execCommand(cmd,false,null)});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#articlesTab').classList.toggle('hidden',b.dataset.tab!=='articles');$('#bookingsTab').classList.toggle('hidden',b.dataset.tab!=='bookings')});
function resetForm(){ $('#articleForm').reset();$('#articleContent').innerHTML='';$('#articleForm [name=id]').value='';$('#articleForm [name=author]').value='Zenzy Editorial';$('#editorTitle').textContent='Create a story'; }
$('#resetArticle').onclick=resetForm;
$('#coverFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const fd=new FormData();fd.append('image',file);$('#articleMsg').textContent='Uploading image...';try{const r=await fetch('/api/media/image',{method:'POST',headers:auth(),body:fd});const d=await r.json();if(!r.ok)throw Error(d.error);$('#articleForm [name=coverImage]').value=d.url;$('#articleMsg').textContent='Image uploaded successfully.'}catch(x){$('#articleMsg').textContent=x.message}};
$('#articleForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f);d.tags=d.tags.split(',').map(x=>x.trim()).filter(Boolean);d.featured=f.get('featured')==='on';d.content=$('#articleContent').innerHTML;const id=d.id;delete d.id;try{const r=await fetch('/api/articles'+(id?'/'+id:''),{method:id?'PUT':'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(d)});const out=await r.json();if(!r.ok)throw Error(out.error);$('#articleMsg').textContent='Article saved: '+out.slug;resetForm();loadArticles()}catch(x){$('#articleMsg').textContent=x.message}};
async function loadArticles(){const q=$('#articleFilter').value;try{const r=await fetch('/api/articles/admin/all'+(q?'?status='+q:''),{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error);$('#articleList').innerHTML=d.items.length?d.items.map(a=>`<div class="item"><div><strong>${esc(a.title)}</strong><div class="muted">/${esc(a.slug)} · ${esc(a.category)} · ${new Date(a.updatedAt).toLocaleDateString()}</div><span class="status">${esc(a.status)}</span></div><div><button data-edit="${a._id}">EDIT</button><button class="btn-light" data-delete="${a._id}">DELETE</button></div></div>`).join(''):'<p class="muted">No articles yet.</p>'}catch(x){$('#articleList').textContent=x.message}}
$('#articleList').onclick=async e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){if(!confirm('Delete this article permanently?'))return;await fetch('/api/articles/'+id,{method:'DELETE',headers:auth()});loadArticles();return}const r=await fetch('/api/articles/admin/'+id,{headers:auth()}),a=await r.json(),f=$('#articleForm');for(const k of ['id','title','category','author','excerpt','coverImage','coverImageAlt','seoTitle','focusKeyword','metaDescription','status'])f.elements[k].value=k==='id'?a._id:(a[k]??'');$('#articleContent').innerHTML=a.content||'';f.elements.tags.value=(a.tags||[]).join(', ');f.elements.featured.checked=!!a.featured;$('#editorTitle').textContent='Edit story';window.scrollTo({top:0,behavior:'smooth'})};
$('#articleFilter').onchange=loadArticles;$('#refreshArticles').onclick=loadArticles;
async function loadBookings(){const q=$('#bookingFilter').value;try{const r=await fetch('/api/bookings/admin/all'+(q?'?status='+q:''),{headers:auth()});const d=await r.json();if(!r.ok)throw Error(d.error);$('#bookingList').innerHTML=d.items.length?d.items.map(b=>`<div class="item"><div><strong>${esc(b.customerName)} · ${esc(b.reference)}</strong><div class="muted">${esc(b.email)} · ${esc(b.phone)} · ${esc(b.bookingType)} · ${b.preferredDate?new Date(b.preferredDate).toLocaleDateString():'No date selected'}</div><p>${esc(b.message)}</p><span class="status">${esc(b.status)}</span></div><div><select data-status="${b._id}">${['NEW','CONTACTED','CONFIRMED','COMPLETED','CANCELLED'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select><button data-save-booking="${b._id}">UPDATE</button></div></div>`).join(''):'<p class="muted">No booking requests yet.</p>'}catch(x){$('#bookingList').textContent=x.message}}
$('#bookingList').onclick=async e=>{const id=e.target.dataset.saveBooking;if(!id)return;const status=$(`[data-status="${id}"]`).value;const r=await fetch('/api/bookings/admin/'+id,{method:'PATCH',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();if(!r.ok)alert(d.error);loadBookings()};$('#bookingFilter').onchange=loadBookings;$('#refreshBookings').onclick=loadBookings;
if(token)showDashboard();
</script></body></html>
