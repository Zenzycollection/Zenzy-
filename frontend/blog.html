<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal | Zenzy Collection</title><meta name="description" content="Style notes, wardrobe ideas and the latest from Zenzy Collection."><style>body{margin:0;background:#f8f7f4;color:#222;font-family:Arial,sans-serif}.head{padding:24px 6%;background:#171717;color:white;display:flex;justify-content:space-between}.head a{color:white;text-decoration:none}.wrap{max-width:1100px;margin:55px auto;padding:0 22px}h1,h2{font-family:Georgia,serif;font-weight:500}.intro{max-width:650px;margin-bottom:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}.card{background:white}.card img{width:100%;height:260px;object-fit:cover}.pad{padding:20px}.muted{color:#777;font-size:13px}.article{max-width:760px;margin:50px auto;padding:0 22px;line-height:1.8}.article img{max-width:100%;height:auto}.article h1{font-size:42px;line-height:1.15}.back{color:#8b6738}@media(max-width:600px){.article h1{font-size:32px}}</style></head><body><header class="head"><a href="/">ZENZY COLLECTION</a><a href="/">SHOP ↗</a></header><main class="wrap" id="app"><div class="intro"><p class="muted">THE ZENZY JOURNAL</p><h1>Style, stories & inspiration.</h1><p>Ideas to help you find your fit, build your wardrobe and wear your own style.</p></div><div id="posts" class="grid">Loading stories...</div></main><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=(()=>{try{return decodeURIComponent(location.pathname.split('/').filter(Boolean)[1]||'')}catch{return''}})();const posts=document.querySelector('#posts');
(async()=>{try{if(slug){const r=await fetch('/api/articles/'+encodeURIComponent(slug)),a=await r.json();if(!r.ok)throw Error(a.error);document.title=(a.seoTitle||a.title)+' | Zenzy Collection';document.querySelector('meta[name=description]').content=a.metaDescription||a.excerpt||'';document.querySelector('#app').innerHTML=`<article class="article"><a class="back" href="/blog">← All stories</a><p class="muted">${esc(a.category)} · ${a.publishedAt?new Date(a.publishedAt).toLocaleDateString():''} · ${Math.max(1,Math.ceil(String(a.content||'').replace(/<[^>]*>/g,' ').split(/\s+/).filter(Boolean).length/200))} min read</p><h1>${esc(a.title)}</h1><p>${esc(a.excerpt)}</p>${a.coverImage?`<img src="${esc(a.coverImage)}" alt="${esc(a.coverImageAlt)}">`:''}<div>${a.content}</div></article>`;return}const r=await fetch('/api/articles');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load stories.');posts.innerHTML=d.items.length?d.items.map(a=>`<article class="card">${a.coverImage?`<img src="${esc(a.coverImage)}" alt="${esc(a.coverImageAlt)}">`:''}<div class="pad"><p class="muted">${esc(a.category)} · ${new Date(a.publishedAt).toLocaleDateString()}</p><h2>${esc(a.title)}</h2><p>${esc(a.excerpt)}</p><a href="/blog/${encodeURIComponent(a.slug)}">READ STORY ↗</a></div></article>`).join(''):'<p>No stories published yet. Check back soon.</p>'}catch(e){posts.textContent=e.message}})();
</script></body></html>
